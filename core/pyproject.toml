[project]
name = "jarvis-core"
version = "0.1.0"
description = "Ядро персонального голосового ассистента «Джарвис»"
requires-python = ">=3.12,<3.14"
dependencies = [
    "websockets>=17.3,<18",
    "psutil>=7.2,<8",
    "pydantic>=2.14,<3",
    "python-dotenv>=1.2,<2",
]

[dependency-groups]
dev = [
    "pytest>=9.1,<10",
    "pytest-asyncio>=1.4,<2",
    "ruff>=0.17,<0.18",
    "pyinstaller>=6.22,<7",
]

[project.scripts]
jarvis-core = "jarvis.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jarvis"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC", "S", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
