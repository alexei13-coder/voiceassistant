# Сборка для Windows: ядро PyInstaller → проверка запуска → установщик NSIS и портативная папка.
name: Сборка для Windows

on:
  push:
    branches: [main, 'stage-*']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Установщик Windows
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7

      # У setup-uv нет плавающего тега мажорной версии — закреплён последний релиз.
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: core/uv.lock

      # Те же параметры, что у локальной сборки: CI запускает тот же скрипт.
      - name: Сборка ядра (PyInstaller, onedir)
        run: ./scripts/build-core.ps1

      # Ядро отказывается работать от имени администратора, а раннер — администратор:
      # скрипт сам запускает ядро с маркером обычного пользователя (см. описание в нём).
      - name: Проверка собранного ядра
        run: ./scripts/smoke-core.ps1 -TimeoutSeconds 20

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Зависимости интерфейса
        working-directory: ui
        run: npm ci

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ui/src-tauri

      # tauri.bundle.conf.json добавляет ресурс core/ ← core/dist/swyvorn-core/; интерфейс собирает beforeBuildCommand.
      - name: Сборка приложения и установщика
        working-directory: ui
        run: npx tauri build --config src-tauri/tauri.bundle.conf.json

      # Tauri на Windows ищет ресурсы рядом с exe, поэтому портативная версия —
      # Swyvorn.exe и папка core\ с ядром, как в установленном приложении.
      - name: Портативная папка
        id: portable
        run: |
          $portable = Join-Path $env:RUNNER_TEMP 'swyvorn-windows-portable'
          $null = New-Item -ItemType Directory -Path (Join-Path $portable 'core') -Force
          Copy-Item -LiteralPath 'ui/src-tauri/target/release/Swyvorn.exe' -Destination $portable
          Copy-Item -Path 'core/dist/swyvorn-core/*' -Destination (Join-Path $portable 'core') -Recurse
          if (-not (Test-Path -LiteralPath (Join-Path $portable 'core/swyvorn-core.exe'))) {
            throw 'В портативной папке нет core\swyvorn-core.exe'
          }
          "path=$portable" >> $env:GITHUB_OUTPUT

      - name: Артефакт — установщик
        uses: actions/upload-artifact@v7
        with:
          name: swyvorn-windows-installer
          path: ui/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14

      - name: Артефакт — портативная версия
        uses: actions/upload-artifact@v7
        with:
          name: swyvorn-windows-portable
          path: ${{ steps.portable.outputs.path }}
          if-no-files-found: error
          retention-days: 14
