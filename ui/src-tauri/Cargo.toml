[package]
name = "jarvis"
version = "0.1.0"
description = "Джарвис — оболочка Tauri: трей, горячие клавиши, запуск ядра"
edition = "2021"
rust-version = "1.85"
publish = false

[lib]
name = "jarvis_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
tauri = { version = "2.12.4", features = ["tray-icon"] }
tauri-plugin-shell = "2.5.0"
tauri-plugin-global-shortcut = "2.4.1"
tauri-plugin-autostart = "2.7.0"
tauri-plugin-single-instance = "2.5.4"
tauri-plugin-log = "2.10.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.0", features = ["sync", "time"] }
getrandom = "0.4.3"
log = "0.4.34"

# Установщик скачивают и распаковывают целиком — размер важнее скорости сборки в CI.
[profile.release]
codegen-units = 1
lto = true
strip = true
