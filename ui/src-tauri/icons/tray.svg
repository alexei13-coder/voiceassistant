<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- Значок трея: упрощённая версия source.svg, читается и в 16 px. Тёмная подложка — для светлой панели задач. -->
  <defs>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#bff8ff"/>
      <stop offset="1" stop-color="#3ee8ff"/>
    </radialGradient>
  </defs>
  <circle cx="16" cy="16" r="15.5" fill="#04070c"/>
  <!-- 6 делений по 42° через 18°; узор начинается с середины разрыва -->
  <circle cx="16" cy="16" r="11" fill="none" stroke="#3ee8ff" stroke-width="4" pathLength="360"
          stroke-dasharray="0 9 42 18 42 18 42 18 42 18 42 18 42 9" transform="rotate(-90 16 16)"/>
  <circle cx="16" cy="16" r="5" fill="url(#core)"/>
</svg>
