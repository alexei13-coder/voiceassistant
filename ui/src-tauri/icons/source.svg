<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Значок SWYVORN, мастер 1024 px (крупные размеры, от 142 px). Тёмная плашка, одно тонкое циановое
       кольцо и светящаяся точка — абстракция ядра. Малые размеры нарисованы отдельно: sizes/app-*.svg
       (толще кольцо, без лишнего свечения). PNG-набор: source.svg → source.png (1024, прозрачный фон) →
       `npx tauri icon src-tauri/icons/source.png`, затем PNG до 128 px и слои icon.ico 16–64 заменяются
       рендерами sizes/app-*.svg -->
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#121820"/>
      <stop offset="0.6" stop-color="#090c10"/>
      <stop offset="1" stop-color="#07090c"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7beaf5"/>
      <stop offset="0.5" stop-color="#3ee0f0"/>
      <stop offset="1" stop-color="#2bc4d6"/>
    </linearGradient>
    <radialGradient id="dot" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.45" stop-color="#d9fbff"/>
      <stop offset="1" stop-color="#7fe9f4"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#3ee0f0" stop-opacity="1"/>
      <stop offset="0.35" stop-color="#3ee0f0" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#3ee0f0" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12.288"/>
    </filter>
  </defs>
