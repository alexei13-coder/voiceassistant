  <!-- волосяная кромка: светлее сверху, чтобы плашка не терялась на тёмной панели -->
  <path d="M61.92 32.00 L61.89 40.29 L61.80 43.48 L61.65 45.87 L61.44 47.84 L61.16 49.54 L60.83 51.04 L60.43 52.38 L59.96 53.59 L59.43 54.69 L58.83 55.69 L58.16 56.59 L57.42 57.42 L56.59 58.16 L55.69 58.83 L54.69 59.43 L53.59 59.96 L52.38 60.43 L51.04 60.83 L49.54 61.16 L47.84 61.44 L45.87 61.65 L43.48 61.80 L40.29 61.89 L32.00 61.92 L23.71 61.89 L20.52 61.80 L18.13 61.65 L16.16 61.44 L14.46 61.16 L12.96 60.83 L11.62 60.43 L10.41 59.96 L9.31 59.43 L8.31 58.83 L7.41 58.16 L6.58 57.42 L5.84 56.59 L5.17 55.69 L4.57 54.69 L4.04 53.59 L3.57 52.38 L3.17 51.04 L2.84 49.54 L2.56 47.84 L2.35 45.87 L2.20 43.48 L2.11 40.29 L2.08 32.00 L2.11 23.71 L2.20 20.52 L2.35 18.13 L2.56 16.16 L2.84 14.46 L3.17 12.96 L3.57 11.62 L4.04 10.41 L4.57 9.31 L5.17 8.31 L5.84 7.41 L6.58 6.58 L7.41 5.84 L8.31 5.17 L9.31 4.57 L10.41 4.04 L11.62 3.57 L12.96 3.17 L14.46 2.84 L16.16 2.56 L18.13 2.35 L20.52 2.20 L23.71 2.11 L32.00 2.08 L40.29 2.11 L43.48 2.20 L45.87 2.35 L47.84 2.56 L49.54 2.84 L51.04 3.17 L52.38 3.57 L53.59 4.04 L54.69 4.57 L55.69 5.17 L56.59 5.84 L57.42 6.58 L58.16 7.41 L58.83 8.31 L59.43 9.31 L59.96 10.41 L60.43 11.62 L60.83 12.96 L61.16 14.46 L61.44 16.16 L61.65 18.13 L61.80 20.52 L61.89 23.71 Z" fill="none" stroke="url(#rim)" stroke-width="0.16"/>
  <!-- мягкое свечение кольца -->
  <circle cx="32" cy="32" r="16.875" fill="none" stroke="#3ee0f0" stroke-width="3.6" opacity="0.13" filter="url(#soft)"/>
  <!-- кольцо — абстракция ядра -->
  <circle cx="32" cy="32" r="16.875" fill="none" stroke="url(#ring)" stroke-width="2.25"/>
  <!-- светящаяся точка в центре и её ореол -->
  <circle cx="32" cy="32" r="13.44" fill="url(#halo)" opacity="0.25"/>
  <circle cx="32" cy="32" r="4.523" fill="url(#dot)"/>
</svg>
