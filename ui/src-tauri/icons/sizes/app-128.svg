  <path d="M121.84 64.00 L121.78 80.63 L121.61 86.80 L121.33 91.40 L120.93 95.18 L120.42 98.43 L119.78 101.28 L119.03 103.84 L118.16 106.13 L117.16 108.21 L116.03 110.10 L114.77 111.81 L113.37 113.37 L111.81 114.77 L110.10 116.03 L108.21 117.16 L106.13 118.16 L103.84 119.03 L101.28 119.78 L98.43 120.42 L95.18 120.93 L91.40 121.33 L86.80 121.61 L80.63 121.78 L64.00 121.84 L47.37 121.78 L41.20 121.61 L36.60 121.33 L32.82 120.93 L29.57 120.42 L26.72 119.78 L24.16 119.03 L21.87 118.16 L19.79 117.16 L17.90 116.03 L16.19 114.77 L14.63 113.37 L13.23 111.81 L11.97 110.10 L10.84 108.21 L9.84 106.13 L8.97 103.84 L8.22 101.28 L7.58 98.43 L7.07 95.18 L6.67 91.40 L6.39 86.80 L6.22 80.63 L6.16 64.00 L6.22 47.37 L6.39 41.20 L6.67 36.60 L7.07 32.82 L7.58 29.57 L8.22 26.72 L8.97 24.16 L9.84 21.87 L10.84 19.79 L11.97 17.90 L13.23 16.19 L14.63 14.63 L16.19 13.23 L17.90 11.97 L19.79 10.84 L21.87 9.84 L24.16 8.97 L26.72 8.22 L29.57 7.58 L32.82 7.07 L36.60 6.67 L41.20 6.39 L47.37 6.22 L64.00 6.16 L80.63 6.22 L86.80 6.39 L91.40 6.67 L95.18 7.07 L98.43 7.58 L101.28 8.22 L103.84 8.97 L106.13 9.84 L108.21 10.84 L110.10 11.97 L111.81 13.23 L113.37 14.63 L114.77 16.19 L116.03 17.90 L117.16 19.79 L118.16 21.87 L119.03 24.16 L119.78 26.72 L120.42 29.57 L120.93 32.82 L121.33 36.60 L121.61 41.20 L121.78 47.37 Z" fill="none" stroke="url(#rim)" stroke-width="0.32"/>
  <!-- мягкое свечение кольца -->
  <circle cx="64" cy="64" r="30.816" fill="none" stroke="#3ee0f0" stroke-width="4.735" opacity="0.195" filter="url(#soft)"/>
  <!-- кольцо — абстракция ядра -->
  <circle cx="64" cy="64" r="30.816" fill="none" stroke="url(#ring)" stroke-width="2.96"/>
  <!-- светящаяся точка в центре и её ореол -->
  <circle cx="64" cy="64" r="24.32" fill="url(#halo)" opacity="0.295"/>
  <circle cx="64" cy="64" r="7.377" fill="url(#dot)"/>
</svg>
