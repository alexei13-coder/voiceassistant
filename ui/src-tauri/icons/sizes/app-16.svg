  <!-- кольцо — абстракция ядра -->
  <circle cx="8" cy="8" r="5.25" fill="none" stroke="url(#ring)" stroke-width="1.5"/>
  <!-- светящаяся точка в центре и её ореол -->
  <circle cx="8" cy="8" r="4" fill="url(#halo)" opacity="0.16"/>
  <circle cx="8" cy="8" r="1.7" fill="url(#dot)"/>
