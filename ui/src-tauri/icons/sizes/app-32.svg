<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- Значок SWYVORN, вариант под 32 px: кольцо толще и крупнее мастера, внешняя кромка на границе
       пикселя. Источник для PNG этого размера (и соседних) и слоя icon.ico -->
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#121820"/>
      <stop offset="0.6" stop-color="#090c10"/>
      <stop offset="1" stop-color="#07090c"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7beaf5"/>
      <stop offset="0.5" stop-color="#3ee0f0"/>
      <stop offset="1" stop-color="#2bc4d6"/>
    </linearGradient>
    <radialGradient id="dot" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.45" stop-color="#d9fbff"/>
      <stop offset="1" stop-color="#7fe9f4"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#3ee0f0" stop-opacity="1"/>
      <stop offset="0.35" stop-color="#3ee0f0" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#3ee0f0" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="0.384"/>
    </filter>
  </defs>
  <!-- плашка: суперэллипс, едва заметный подъём тона сверху -->
  <path d="M31.50 16.00 L31.48 20.13 L31.44 21.78 L31.35 23.02 L31.24 24.05 L31.10 24.94 L30.92 25.73 L30.70 26.44 L30.46 27.08 L30.17 27.66 L29.85 28.18 L29.50 28.67 L29.10 29.10 L28.67 29.50 L28.18 29.85 L27.66 30.17 L27.08 30.46 L26.44 30.70 L25.73 30.92 L24.94 31.10 L24.05 31.24 L23.02 31.35 L21.78 31.44 L20.13 31.48 L16.00 31.50 L11.87 31.48 L10.22 31.44 L8.98 31.35 L7.95 31.24 L7.06 31.10 L6.27 30.92 L5.56 30.70 L4.92 30.46 L4.34 30.17 L3.82 29.85 L3.33 29.50 L2.90 29.10 L2.50 28.67 L2.15 28.18 L1.83 27.66 L1.54 27.08 L1.30 26.44 L1.08 25.73 L0.90 24.94 L0.76 24.05 L0.65 23.02 L0.56 21.78 L0.52 20.13 L0.50 16.00 L0.52 11.87 L0.56 10.22 L0.65 8.98 L0.76 7.95 L0.90 7.06 L1.08 6.27 L1.30 5.56 L1.54 4.92 L1.83 4.34 L2.15 3.82 L2.50 3.33 L2.90 2.90 L3.33 2.50 L3.82 2.15 L4.34 1.83 L4.92 1.54 L5.56 1.30 L6.27 1.08 L7.06 0.90 L7.95 0.76 L8.98 0.65 L10.22 0.56 L11.87 0.52 L16.00 0.50 L20.13 0.52 L21.78 0.56 L23.02 0.65 L24.05 0.76 L24.94 0.90 L25.73 1.08 L26.44 1.30 L27.08 1.54 L27.66 1.83 L28.18 2.15 L28.67 2.50 L29.10 2.90 L29.50 3.33 L29.85 3.82 L30.17 4.34 L30.46 4.92 L30.70 5.56 L30.92 6.27 L31.10 7.06 L31.24 7.95 L31.35 8.98 L31.44 10.22 L31.48 11.87 Z" fill="url(#plate)"/>
  <!-- мягкое свечение кольца -->
  <circle cx="16" cy="16" r="9" fill="none" stroke="#3ee0f0" stroke-width="3.2" opacity="0.065" filter="url(#soft)"/>
  <!-- кольцо — абстракция ядра -->
  <circle cx="16" cy="16" r="9" fill="none" stroke="url(#ring)" stroke-width="2"/>
  <!-- светящаяся точка в центре и её ореол -->
  <circle cx="16" cy="16" r="7.36" fill="url(#halo)" opacity="0.205"/>
  <circle cx="16" cy="16" r="2.773" fill="url(#dot)"/>
</svg>
